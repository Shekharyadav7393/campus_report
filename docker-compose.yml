version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campus_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: campus_redis
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campus
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_docker_secret_key_change_in_prod_rotation_flow
      - JWT_REFRESH_SECRET=super_refresh_secret_docker_secret_key_change_in_prod_rotation_flow
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
